name: Deploy Cloudflare Pages

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # develop -> staging (netpay-plataforma-stg.gsanmartin.net), main -> producción (netpay-plataforma.gsanmartin.net)
      PAGES_PROJECT: ${{ github.ref_name == 'main' && 'netpay-plataforma' || 'netpay-plataforma-stg' }}
      VITE_API_URL: ${{ github.ref_name == 'main' && 'https://api-netpay.gsanmartin.net' || 'https://api-netpay-stg.gsanmartin.net' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.ref_name }}
